name: Daily AI Podcast

on:
  schedule:
    # 每天 UTC 00:00（北京时间 8:00）运行；GitHub 定时任务是尽力调度，可能延迟 15-30 分钟
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发，方便首次测试

# 同一时刻只允许一个更新任务，避免音频文件互相覆盖
concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -n 1

      - name: Fetch news, write script, synthesize podcast
        id: build
        uses: nick-fields/retry@v4
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          SCRIPT_LLM_API_KEY: ${{ secrets.SCRIPT_LLM_API_KEY }}
        with:
          timeout_minutes: 25
          max_attempts: 2
          retry_wait_seconds: 60
          command: python -m podcast.main

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-podcast-${{ github.run_number }}
          path: data/episodes/*.mp3
          retention-days: 30
          if-no-files-found: error

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-podcast-script-${{ github.run_number }}
          path: |
            data/script.json
            data/picks.json
          retention-days: 30
          if-no-files-found: warn
