# 朗读规范：多音字与易错术语 → 替代写法
# 作用：1) 写稿提示词里约束 LLM 使用替代字；2) 稿件落盘前再做一次确定性替换
# 说明：rewrite 为空表示只提示读音、不改写
rules:
  # —— 多音字 ——
  - term: "重试"
    rewrite: "再试一次"
    note: "重 读 chóng"
  - term: "重新发布"
    rewrite: "再次发布"
    note: "重 读 chóng"
  - term: "侧重"
    rewrite: "重点强调"
    note: "侧 读 cè"
  - term: "银行"
    rewrite: "银行业"
    note: "行 读 háng"
  - term: "分行"
    rewrite: "银行分支机构"
    note: "行 读 háng"
  - term: "行长"
    rewrite: "银行负责人"
    note: "行 读 háng"
  - term: "长城"
    rewrite: "万里长城"
    note: "长 读 cháng"
  - term: "长上下文"
    rewrite: "长上下文"
    note: "长 读 cháng"
  - term: "单卡"
    rewrite: "单张显卡"
    note: "单 读 dān"
  - term: "多卡"
    rewrite: "多张显卡"
    note: "多 读 duō"
  - term: "落盘"
    rewrite: "写入磁盘"
    note: "落 读 luò"
  - term: "弹窗"
    rewrite: "弹出窗口"
    note: "弹 读 tán"
  - term: "分叉"
    rewrite: "分支"
    note: "分 读 fēn"
  - term: "重组"
    rewrite: "重新组合"
    note: "重 读 chóng"
  - term: "打折"
    rewrite: "降价优惠"
    note: "折 读 zhé"
  - term: "便宜"
    rewrite: "价格低"
    note: "便 读 pián"

  # —— 英文术语 / 缩写（朗读友好写法） ——
  - term: "LLM"
    rewrite: "大语言模型"
    note: "首次出现给中文全称"
  - term: "API"
    rewrite: "接口"
  - term: "SDK"
    rewrite: "开发工具包"
  - term: "GPU"
    rewrite: "显卡"
  - term: "CPU"
    rewrite: "处理器"
  - term: "VRAM"
    rewrite: "显存"
  - term: "Agent"
    rewrite: "智能体"
  - term: "agent"
    rewrite: "智能体"
  - term: "benchmark"
    rewrite: "基准测试"
  - term: "Benchmark"
    rewrite: "基准测试"
  - term: "MoE"
    rewrite: "混合专家架构"
  - term: "RAG"
    rewrite: "检索增强生成"
  - term: "MCP"
    rewrite: "模型上下文协议"
  - term: "RLHF"
    rewrite: "人类反馈强化学习"
  - term: "Transformer"
    rewrite: "变换器模型"
  - term: "prompt"
    rewrite: "提示词"
  - term: "fine-tune"
    rewrite: "微调"
  - term: "open-source"
    rewrite: "开源"
  - term: "web"
    rewrite: "网页"
  - term: "app"
    rewrite: "应用"
  - term: "plugin"
    rewrite: "插件"
  - term: "TTS"
    rewrite: "语音合成"
  - term: "OCR"
    rewrite: "文字识别"
  - term: "AIGC"
    rewrite: "生成式人工智能"
  - term: "AGI"
    rewrite: "通用人工智能"
  - term: "startup"
    rewrite: "创业公司"
  - term: "ARR"
    rewrite: "年度经常性收入"

  # —— 型号 / 数字 ——
  - term: "A100"
    rewrite: "A 一百"
    note: "避免读成 A 一千零"
  - term: "H100"
    rewrite: "H 一百"
  - term: "H800"
    rewrite: "H 八百"
  - term: "B200"
    rewrite: "B 两百"
