podcast:
  title: "AI 每日资讯"
  author: "AI Daily Podcast Bot"
  # MiMo 预置音色：冰糖/茉莉(中文女)、苏打/白桦(中文男)、Mia/Chloe(英文女)、Milo/Dean(英文男)、mimo_default
  voice: "suda"
  # 每期最多播报的资讯条数
  max_items: 12
  # 音频保留天数：超过该天数的旧音频会在每次运行时自动删除（防止仓库无限膨胀）
  retention_days: 90
  # 部署后请改成你的 Pages 地址，例如 https://<你的用户名>.github.io/<仓库名>/
  site_base_url: "https://example.github.io/ai-daily-podcast/"

script_llm:
  # MiniMax 开放平台，OpenAI 兼容接口；SCRIPT_LLM_API_KEY 填 MiniMax 的 API Key
  base_url: "https://api.minimax.cn/v1"
  model: "MiniMax-M3.1-Flash"
  # 口播稿每段的目标长度上限（字符），MiMo TTS 单次上下文 8K token，段落短一些更稳
  segment_max_chars: 400

tts:
  base_url: "https://api.xiaomimimo.com/v1"
  model: "mimo-v2.5-tts"
  format: "mp3"
  # 单次 TTS 请求的文本长度上限（超出自动按句子切分）
  max_chars_per_chunk: 900
