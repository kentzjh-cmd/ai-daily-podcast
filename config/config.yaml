podcast:
  title: "AI 每日资讯"
  author: "AI Daily Podcast Bot"
  # MiMo 预置音色：冰糖/茉莉(中文女)、苏打/白桦(中文男)、Mia/Chloe(英文女)、Milo/Dean(英文男)、mimo_default
  voice: "苏打"
  # 每期条数区间：写稿时由模型在区间内自行判断（8-14 条）
  min_items: 8
  max_items: 14
  # 写稿 LLM 并发数（逐条独立生成口播内容）
  llm_workers: 4
  # 是否做逐段风格复核（去 AI 味），会额外调用一轮 LLM
  style_review: true

aihot:
  # AIHOT 公开 API（https://aihot.news）：已由 LLM 筛选/打分/聚簇并生成中文摘要，无需 API Key
  enabled: true
  base_url: "https://aihot.news"
  # window 可选 24h / 7d（本期用 24h）
  window: "24h"
  limit: 60
  lang: "zh"
  # 站点会校验 User-Agent，缺失时返回 403
  user_agent: "ai-daily-podcast/1.0 (podcast bot; +https://aihot.news)"

script_llm:
  # MiniMax 开放平台，OpenAI 兼容接口；SCRIPT_LLM_API_KEY 填 MiniMax 的 API Key
  base_url: "https://api.minimax.cn/v1"
  model: "MiniMax-M3.1-Flash"
  # 口播稿每段的目标长度上限（字符），MiMo TTS 单次上下文 8K token，段落短一些更稳
  segment_max_chars: 400

tts:
  base_url: "https://api.xiaomimimo.com/v1"
  model: "mimo-v2.5-tts"
  # 用 wav 合成，拼接时不反复转码，最后统一编码成 128k mp3（社区有声书方案的做法）
  format: "wav"
  # 音色（也可在 podcast.voice 里指定，这里的值优先）：mimo_default / 冰糖 / 茉莉 / 苏打 / 白桦 / Mia / Chloe / Milo / Dean
  voice: "苏打"
  # 风格指令：用 user 消息传给 MiMo TTS，控制语气与语速（实测有效）
  style: "用播客主播的语气自然讲述，不要播音腔，停顿自然从容，不要赶。"
  # 整体语速倍率（atempo，音调不变）：1.0 原速；调小更慢（0.9~0.97），调大更快但容易失真
  speed: 1.0
  # 单次 TTS 请求的文本长度上限（超出自动按句子切分）
  max_chars_per_chunk: 2000
