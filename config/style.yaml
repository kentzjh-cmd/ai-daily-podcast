# 口播风格规则（去 AI 味 + 朗读友好）
# 依据社区经验整理：去 AI 味写作指南（deslop-zh）+ 中文播客口播实践
# 作用：1) 注入写稿提示词；2) 作为逐段风格复核的标准
rules:
  # —— 句子形态（关键：短，但不能写成电报体）——
  - "每句话控制在 15 到 30 个字。句子要完整：有主语、有动作，不要写成关键词清单"
  - "不要把一句话拆成一串只有几个字的短句，那听起来像念 PPT"
  - "一句话讲不完就分成两三句，每句都要能独立听懂"
  - "关键信息要留住：谁做的、什么时候、做了什么、关键数字是多少，不要为了简短把主语或动作省掉"
  - "少用长定语和从句，能拆就拆"
  - "一句话最多一个逗号，不要连着三个逗号"
  - "不要每条都以「XX 发布/宣布/推出」开头，换几种说法"
  - "同一段里不要重复同一个说法（比如连着两句都出现「需要留意」）"

  # —— 去 AI 味：句式硬约束 ——
  - "禁止「不是 X，而是 Y」这类否定对比句式"
  - "禁止段末总结句：这说明、可以看出、由此可见、综上所述、简而言之、总而言之、一句话总结"
  - "禁止升华句，不要把一件小事拔高成行业趋势或人生道理"
  - "禁止「首先…其次…最后…」三连排比"
  - "禁止「值得注意的是」「事实上」「实际上」「众所周知」「显而易见」这类填充词"
  - "禁止「这标志着」「彰显了」「体现了」「掀起了…浪潮」这类宣传腔"
  - "禁止模糊归因：据业内人士指出、有评论认为——要么说清是谁说的，要么不说"
  - "禁止互联网黑话：赋能、抓手、闭环、沉淀、对齐、拉通、打通、协同、洞察、赛道、布局、矩阵、颗粒度、复盘、梳理"

  # —— 去 AI 味：用词 ——
  - "用词口语化：非常/极其→很、例如→比如、进行+动词→动词本身、呈现→是、拥有→有"
  - "不要在结尾替听众下评述（比如「这项研究值得关注，因为它…」），换成具体的听众影响：谁会因此受益、谁需要留意什么"

  # —— 朗读友好（给 TTS）——
  - "数字直接用阿拉伯数字，不要转成中文数字：2026 年 11 月 26 日、五千四百一十四家、百分之七十、每��� 0.08 美元"
  - "金额写成口语：0.08 美元→八美分，1.5 美元→一块五"
  - "中英文之间加空格：模型 与 AI；数字与中文之间加空格：提升 30%"
  - "不使用破折号、感叹号、括号、书名号、表情"
  - "不要出现链接、编号、括号注释"
  - "公司名、产品名保留英文原名（Anthropic、OpenAI、Google、Meta、xAI、Character.AI、Claude、GPT）"

  # —— 允许的人味 ——
  - "可以有主持人视角，但别硬塞口头禅：不要「说白了」「居然」「谁能想到」「太牛了」"
  - "同一段里不要连续三个短句像打电报"
